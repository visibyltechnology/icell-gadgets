<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ICELL GADGETS — Nigeria's Trusted Store</title>
    <meta name="description" content="ICELL GADGETS — Nigeria's premier destination for smartphones, tablets, premium audio and accessories.">
    <meta name="theme-color" content="#1A2856">
    <!-- Google Fonts: Outfit (headings) + Inter (body) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- FontAwesome for Premium Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
      /* Custom scrollbar */
      ::-webkit-scrollbar { width: 6px; }
      ::-webkit-scrollbar-track { background: #F8FAFC; }
      ::-webkit-scrollbar-thumb { background: #1A2856; border-radius: 3px; }
      ::-webkit-scrollbar-thumb:hover { background: #E31E24; }

      /* Smooth transition base */
      .transition-all-300 { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
    </style>
  </head>
  <body class="bg-[#FFFFFF] text-gray-900 font-sans overflow-x-hidden w-full">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>

</html>
